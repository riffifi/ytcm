name: ytcm
description: YTC Messenger client
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  provider: ^6.1.2
  flutter_local_notifications: ^18.0.1
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  path_provider: ^2.0.14
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.10.0

# Configuration for flutter_launcher_icons
flutter_icons:
  android: true
  ios: false
  image_path: "Yellow Tea Crew logoC1.png"

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/

  fonts:
    - family: ABCDiatype
      fonts:
        - asset: fonts/ABCDiatypeCyrillicVariable-Trial.ttf
